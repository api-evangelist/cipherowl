summary: >-
  CipherOwl exposes a free sandbox via the co-sandbox risk configuration. Add
  ?config=co-sandbox to any Screening or Risk Reason request. A curated set of EVM
  and Tron addresses returns a real risky verdict with real reasons; every other
  address returns clean (foundRisk: false). Requires a free-tier account and a
  valid OAuth token. The Report API also honors ?config=co-sandbox but strictly
  requires the `evm` chain key.
