problems:
- status: 400
  title: Bad request
  remediation: Fix the request; refer to the response body (message/details) for the
    specific validation error.
- status: 401
  title: Unauthorized
  remediation: Bearer token expired or rejected. Request a new OAuth token from
    /oauth/token and retry the request once.
- status: 403
  title: Forbidden
  remediation: The caller is not authorized for this API, or the path is incorrect
    (an incorrect API path also returns 403).
- status: 429
  title: Too Many Requests
  remediation: Rate limit exceeded. Back off and retry, honoring the Retry-After
    header when present; otherwise use exponential backoff.
- status: 500
  title: Internal server error
  remediation: Unexpected server error. Retry with backoff; contact CipherOwl support
    if it persists.
