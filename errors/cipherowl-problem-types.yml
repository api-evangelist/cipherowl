note: >-
  CipherOwl is a gRPC-gateway API; error responses use the google.rpc.Status
  envelope (schema rpcStatus: code, message, details[]) rather than RFC 9457
  application/problem+json. HTTP status semantics are documented on the Status
  Codes reference page.
envelope:
  schema: rpcStatus
  fields:
  - code
