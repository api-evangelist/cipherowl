aid: cipherowl
name: CipherOwl
description: >-
  CipherOwl provides AI-powered security and compliance for institutional
  stablecoins and digital assets. Its Screening, Risk & Reporting (SRR) API turns a
  blockchain address into a compliance decision: real-time sanctions and risk
  screening, deterministic 0-100 risk scoring, categorized risk breakdowns,
  path-level exposure evidence (including cross-chain), and analyst-ready risk
  assessment, SAR, and risk-flow-graph reports across Bitcoin, EVM, Tron, Solana,
  XRP and more. The platform also offers an Onchain balance service and a
  Private Data override service, an OwlTrace research experience, a Strix AI
  investigation agent, and a first-party CLI (cipherowl-sr3) that doubles as a
  Model Context Protocol server. Authentication is OAuth 2.0 client-credentials.
